<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Racing Mobile Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background-color: #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #555;
        }

        /* Top Bar UI */
        .top-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-top {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Overlays (Start, Pause, Game Over, Win) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .overlay h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .overlay p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #ccc;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff3366, #ff6633);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            cursor: pointer;
            width: 80%;
            max-width: 250px;
        }

        .btn-main:active {
            transform: scale(0.95);
        }

        /* Mobile Controls UI */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Layer -->
        <canvas id="gameCanvas"></canvas>

        <!-- Top UI -->
        <div class="top-ui">
            <div class="stat-box">LEVEL: <span id="ui-level">1</span></div>
            <div class="stat-box">SCORE: <span id="ui-score">0</span></div>
            <button class="btn-top" id="btn-pause">⏸</button>
        </div>

        <!-- Touch Controls -->
        <div class="controls">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>

        <!-- Main Menu Overlay -->
        <div class="overlay" id="screen-start">
            <h1>SPEED RACER 2D</h1>
            <p>T'eviter t-tobissat wa l-wirane, zid f l-points bash t-fat l-levels!</p>
            <button class="btn-main" id="btn-start">START GAME</button>
        </div>

        <!-- Pause Overlay -->
        <div class="overlay hidden" id="screen-pause">
            <h1>GAME PAUSED</h1>
            <p>Game is currently paused.</p>
            <button class="btn-main" id="btn-resume">RESUME</button>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay hidden" id="screen-gameover">
            <h1 style="color: #ff3333;">GAME OVER</h1>
