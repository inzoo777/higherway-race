<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d0f18;
            color: #fff;
            overflow: hidden;
        }

        .arcade-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* Glassmorphism UI styling */
        .glass-panel {
            background: rgba(22, 27, 46, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .arcade-btn {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);

            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        /* Control touch feedback */
        .control-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            touch-action: none;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(255, 255, 255, 0.35);
            border-color: #3b82f6;

        .nitro-btn:active, .nitro-btn.active {
            background: rgba(239, 68, 68, 0.4);
            border-color: #ef4444;

        /* Scanline Arcade Overlay */

            pointer-events: none;

    </style>

    <script>
        // Web Audio API Synthesizer for Retro SFX
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.engineOsc = null;
                this.engineGain = null;
                this.isMuted = false;
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }

            startEngineSound() {
                if (!this.ctx || this.engineOsc) return;
                
                try {
                    this.engineOsc = this.ctx.createOscillator();
                    this.engineGain = this.ctx.createGain();

                    this.engineOsc.type = 'sawtooth';
                    this.engineOsc.frequency.setValueAtTime(40, this.ctx.currentTime);

                    // Lowpass filter to muffle engine sound comfortably
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(300, this.ctx.currentTime);

                    this.engineGain.gain.setValueAtTime(0.08, this.ctx.currentTime);

                    this.engineOsc.connect(filter);
                    filter.connect(this.engineGain);
                    this.engineGain.connect(this.ctx.destination);

                    this.engineOsc.start();
                } catch(e) { console.log(e); }
            }

            updateEnginePitch(speedRatio) {
                if (!this.engineOsc || !this.ctx) return;
                const targetFreq = 40 + (speedRatio * 160);
                this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
            }

            stopEngineSound() {
                if (this.engineOsc) {
                    try {
                        this.engineOsc.stop();
                        this.engineOsc.disconnect();
                    } catch(e) {}
                    this.engineOsc = null;
                }
            }

            playCoinSFX() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playCrashSFX() {
                if (!this.ctx) return;
                // White noise buffer generator for crash effect
                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                noise.stop(this.ctx.currentTime + 0.5);
            }
        }

        const audio = new SoundEngine();
    </script>

    <script>
        // DOM Elements setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const speedText = document.getElementById('speedText');
        const coinText = document.getElementById('coinText');
        
        const uiOverlay = document.getElementById('uiOverlay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const enableGyroBtn = document.getElementById('enableGyroBtn');
        const gyroStatus = document.getElementById('gyroStatus');

        const finalScore = document.getElementById('finalScore');
        const finalCoins = document.getElementById('finalCoins');
        const bestScore = document.getElementById('bestScore');
        const startHighScore = document.getElementById('startHighScore');

        // Control Buttons
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnBrake = document.getElementById('btnBrake');
        const btnNitro = document.getElementById('btnNitro');

        // Internal Game State Constants
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 700;
        const ROAD_WIDTH = 280;
        const LANE_COUNT = 3;
        const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
        const ROAD_LEFT = (CANVAS_WIDTH - ROAD_WIDTH) / 2;

        // Player State
        let player = {
            x: CANVAS_WIDTH / 2 - 20,
            y: CANVAS_HEIGHT - 130,
            width: 40,
            height: 70,
            speed: 0,
            maxSpeed: 180,
            normalMaxSpeed: 140,
            nitroMaxSpeed: 220,
            acceleration: 0.8,
            friction: 0.96,
            steerSpeed: 5.5,
            vx: 0,
            tilt: 0
        };

        // Game Environment & Logic
        let gameActive = false;
        let score = 0;
        let coinsCount = 0;
        let roadOffset = 0;
        let traffic = [];
        let coins = [];
        let particles = [];
        let highScore = parseInt(localStorage.getItem('retro_racer_highscore') || '0');

        // Input Tracking Flags
        const inputs = {
            left: false,
            right: false,
            brake: false,
            nitro: false,
            gyroGamma: 0
        };

        let gyroEnabled = false;

        // Resize Canvas Internal Resolution while maintaining responsive layout
        function resizeCanvas() {
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
        }
        resizeCanvas();

        // Display saved high score initially
        startHighScore.textContent = String(highScore).padStart(6, '0');

        // Control listeners helper
        function setupButton(element, key) {
            const start = (e) => {
                e.preventDefault();
                inputs[key] = true;
                element.classList.add('active');
            };
            const end = (e) => {
                e.preventDefault();
                inputs[key] = false;
                element.classList.remove('active');
            };

            element.addEventListener('touchstart', start, { passive: false });
            element.addEventListener('touchend', end, { passive: false });
            element.addEventListener('mousedown', start);
            element.addEventListener('mouseup', end);
            element.addEventListener('mouseleave', end);
        }

        setupButton(btnLeft, 'left');
        setupButton(btnRight, 'right');
        setupButton(btnBrake, 'brake');
        setupButton(btnNitro, 'nitro');

        // Keyboard Controls Fallback
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.nitro = true;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') inputs.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') inputs.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') inputs.nitro = false;
            if (e.key === 'ArrowDown' || e.key === 's') inputs.brake = false;
        });

        // Optional Gyroscope Setup
        function handleOrientation(e) {
            if (!gyroEnabled) return;
            // Gamma is left to right tilt in degrees [-90 to 90]
            if (e.gamma !== null) {
                inputs.gyroGamma = e.gamma;
            }
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                enableGyroBtn.classList.remove('hidden');
                enableGyroBtn.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if (state === 'granted') {
                            gyroEnabled = true;
                            window.addEventListener('deviceorientation', handleOrientation);
                            gyroStatus.textContent = 'Active';
                            gyroStatus.className = 'ml-2 text-emerald-400 font-bold';
                            enableGyroBtn.classList.add('hidden');
                        }
                    }).catch(console.error);
                });
            } else {
                gyroEnabled = true;
                window.addEventListener('deviceorientation', handleOrientation);
                gyroStatus.textContent = 'Active';
                gyroStatus.className = 'ml-2 text-emerald-400 font-bold';
            }
        }

        // Traffic Spawning
        function spawnTraffic() {
            const laneIndex = Math.floor(Math.random() * LANE_COUNT);
            const laneX = ROAD_LEFT + (laneIndex * LANE_WIDTH) + (LANE_WIDTH / 2) - 20;
            
            // Prevent spawning right on top of another traffic car
            const tooClose = traffic.some(car => Math.abs(car.y - (-100)) < 160 && car.lane === laneIndex);
            if (!tooClose) {
                const colors = ['#e11d48', '#3b82f6', '#10b981', '#a855f7', '#f59e0b', '#64748b'];
                const carColor = colors[Math.floor(Math.random() * colors.length)];
                traffic.push({
                    x: laneX,
                    y: -100,
                    width: 40,
                    height: 70,
                    speed: Math.random() * 2 + 2,
                    color: carColor,
                    lane: laneIndex
                });
            }
        }

        // Coin Spawning
        function spawnCoin() {
            const laneIndex = Math.floor(Math.random() * LANE_COUNT);
            const laneX = ROAD_LEFT + (laneIndex * LANE_WIDTH) + (LANE_WIDTH / 2);
            
            coins.push({
                x: laneX,
                y: -40,
                radius: 12,
                rotation: 0
            });
        }

        // Particle System for Nitro/Exhaust
        function createExhaustParticle() {
            particles.push({
                x: player.x + player.width / 2 + (Math.random() * 10 - 5),
                y: player.y + player.height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 3 + 2,
                size: inputs.nitro ? Math.random() * 8 + 4 : Math.random() * 4 + 2,
                color: inputs.nitro ? '#ef4444' : '#64748b',
                alpha: 1
            });
        }

        // Draw Curved/Styled Top-Down Car
        function drawCar(x, y, width, height, mainColor, isPlayer = false, tilt = 0) {
            ctx.save();
            ctx.translate(x + width / 2, y + height / 2);
            ctx.rotate(tilt * Math.PI / 180);

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(-width / 2 + 4, -height / 2 + 6, width, height);

            // Wheels
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-width / 2 - 3, -height / 2 + 8, 5, 14); // Front Left
            ctx.fillRect(width / 2 - 2, -height / 2 + 8, 5, 14);  // Front Right
            ctx.fillRect(-width / 2 - 3, height / 2 - 22, 5, 14); // Rear Left
            ctx.fillRect(width / 2 - 2, height / 2 - 22, 5, 14);  // Rear Right

            // Main Body
            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.roundRect(-width / 2, -height / 2, width, height, 8);
            ctx.fill();

            // Roof / Windshield Overlay
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-width / 2 + 4, -height / 2 + 18, width - 8, height - 36);

            // Glass/Windshield
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect(-width / 2 + 6, -height / 2 + 20, width - 12, 12, 3); // Front
            ctx.roundRect(-width / 2 + 6, height / 2 - 26, width - 12, 8, 2);  // Rear
            ctx.fill();

            // Headlights
            ctx.fillStyle = isPlayer ? '#fef08a' : '#fee2e2';
            ctx.fillRect(-width / 2 + 4, -height / 2 + 2, 8, 4);
            ctx.fillRect(width / 2 - 12, -height / 2 + 2, 8, 4);

            // Tail Lights
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-width / 2 + 4, height / 2 - 4, 8, 3);
            ctx.fillRect(width / 2 - 12, height / 2 - 4, 8, 3);

            // Racing Stripe for Player
            if (isPlayer) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-3, -height / 2, 6, height);
            }

            ctx.restore();
        }

        // Draw Environment & Highway
        function drawRoad() {
            // Grass Margins
            ctx.fillStyle = '#052e16';
            ctx.fillRect(0, 0, ROAD_LEFT, CANVAS_HEIGHT);
            ctx.fillRect(ROAD_LEFT + ROAD_WIDTH, 0, ROAD_LEFT, CANVAS_HEIGHT);

            // Road Asphalt
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, CANVAS_HEIGHT);

            // Red-White Curb Borders
            const curbHeight = 30;
            const curbOffset = roadOffset % (curbHeight * 2);
            for (let y = -curbHeight * 2; y < CANVAS_HEIGHT + curbHeight * 2; y += curbHeight) {
                const isRed = Math.floor((y - curbOffset) / curbHeight) % 2 === 0;
                ctx.fillStyle = isRed ? '#ef4444' : '#ffffff';
                ctx.fillRect(ROAD_LEFT - 8, y + curbOffset, 8, curbHeight);
                ctx.fillRect(ROAD_LEFT + ROAD_WIDTH, y + curbOffset, 8, curbHeight);
            }

            // Lane Dividers (Dashed White Lines)
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.lineDashOffset = -roadOffset;

            for (let i = 1; i < LANE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(ROAD_LEFT + i * LANE_WIDTH, -50);
                ctx.lineTo(ROAD_LEFT + i * LANE_WIDTH, CANVAS_HEIGHT + 50);
                ctx.stroke();
            }
            ctx.setLineDash([]); // Reset dash state
        }

        function update() {
            if (!gameActive) return;

            // Handle Speeds & Acceleration
            let targetMaxSpeed = inputs.nitro ? player.nitroMaxSpeed : player.normalMaxSpeed;
            if (inputs.brake) targetMaxSpeed = 40;

            if (player.speed < targetMaxSpeed) {
                player.speed += player.acceleration;
            } else if (player.speed > targetMaxSpeed) {
                player.speed -= player.acceleration * 2;
            }

            // Update Engine Audio Pitch
            audio.updateEnginePitch(player.speed / player.nitroMaxSpeed);

            // Steering Input calculation (Buttons + Gyro)
            let moveDir = 0;
            if (inputs.left) moveDir -= 1;
            if (inputs.right) moveDir += 1;

            if (gyroEnabled && Math.abs(inputs.gyroGamma) > 3) {
                moveDir += Math.max(-1, Math.min(1, inputs.gyroGamma / 20));
            }

            player.vx = moveDir * player.steerSpeed;
            player.x += player.vx;
            player.tilt = moveDir * 8; // Visual steering angle roll

            // Clamp Player to Road Boundaries
            if (player.x < ROAD_LEFT + 10) {
                player.x = ROAD_LEFT + 10;
                player.speed *= 0.95; // Rough curb slowdown
            }
            if (player.x + player.width > ROAD_LEFT + ROAD_WIDTH - 10) {
                player.x = ROAD_LEFT + ROAD_WIDTH - 10 - player.width;
                player.speed *= 0.95;
            }

            // Scroll Road according to Player Speed
            const roadSpeed = player.speed * 0.12;
            roadOffset += roadSpeed;

            // Score Increment
            score += Math.floor(player.speed * 0.05);
            scoreText.textContent = String(score).padStart(6, '0');
            speedText.textContent = Math.floor(player.speed);

            // Spawn Particles
            if (Math.random() < 0.6) createExhaustParticle();

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.y += roadSpeed * 0.5;
                p.x += p.vx;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Spawn & Update Traffic Vehicles
            if (Math.random() < 0.025) spawnTraffic();

            for (let i = traffic.length - 1; i >= 0; i--) {
                const car = traffic[i];
                // Traffic moves relative to player speed
                car.y += roadSpeed - car.speed;

                // Collision Detection (Box AABB with inset tolerance)
                const margin = 5;
                if (
                    player.x + margin < car.x + car.width - margin &&
                    player.x + player.width - margin > car.x + margin &&
                    player.y + margin < car.y + car.height - margin &&
                    player.y + player.height - margin > car.y + margin
                ) {
                    gameOver();
                    return;
                }

                // Remove offscreen traffic
                if (car.y > CANVAS_HEIGHT + 100 || car.y < -200) {
                    traffic.splice(i, 1);
                }
            }

            // Spawn & Update Gold Coins
            if (Math.random() < 0.015) spawnCoin();

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.y += roadSpeed;
                coin.rotation += 0.1;

                // Circle to Rect Collision with player
                const distX = Math.abs(coin.x - (player.x + player.width / 2));
                const distY = Math.abs(coin.y - (player.y + player.height / 2));

                if (distX < (player.width / 2 + coin.radius) && distY < (player.height / 2 + coin.radius)) {
                    // Picked up coin
                    coinsCount++;
                    score += 250;
                    coinText.textContent = coinsCount;
                    audio.playCoinSFX();
                    coins.splice(i, 1);
                    continue;
                }

                // Remove offscreen coins
                if (coin.y > CANVAS_HEIGHT + 50) {
                    coins.splice(i, 1);
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Road
            drawRoad();

            // Draw Exhaust Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Gold Coins
            coins.forEach(coin => {
                ctx.save();
                ctx.translate(coin.x, coin.y);
                ctx.scale(Math.sin(coin.rotation), 1); // 3D Coin flip effect
                
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(0, 0, coin.radius - 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            // Draw Traffic Cars
            traffic.forEach(car => {
                drawCar(car.x, car.y, car.width, car.height, car.color);
            });

            // Draw Player Car
            drawCar(player.x, player.y, player.width, player.height, '#2563eb', true, player.tilt);
        }

        // Master Game Loop
        function gameLoop() {
            update();
            render();
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            audio.init();
            audio.startEngineSound();

            // Reset States
            score = 0;
            coinsCount = 0;
            traffic = [];
            coins = [];
            particles = [];
            player.x = CANVAS_WIDTH / 2 - player.width / 2;
            player.speed = 0;

            scoreText.textContent = '000000';
            coinText.textContent = '0';
            speedText.textContent = '0';

            gameActive = true;
            uiOverlay.classList.add('hidden');
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            audio.stopEngineSound();
            audio.playCrashSFX();

            // Save High Score in localStorage
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('retro_racer_highscore', highScore.toString());
            }

            finalScore.textContent = String(score).padStart(6, '0');
            finalCoins.textContent = coinsCount;
            bestScore.textContent = String(highScore).padStart(6, '0');

            uiOverlay.classList.remove('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        // Button Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Render initial static scene behind menu
        drawRoad();
        drawCar(player.x, player.y, player.width, player.height, '#2563eb', true, 0);
    </script>
</body>
</html>
