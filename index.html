<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Car Racing Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 380px;
      height: 600px;
      background: #333;
      border: 4px solid #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Score Board */
    .score-board {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
    }

    /* Road Lines */
    .line {
      position: absolute;
      width: 10px;
      height: 90px;
      background: #fff;
      left: 185px;
    }

    /* Car Styles */
    .car, .enemy {
      position: absolute;
      width: 50px;
      height: 90px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    }

    /* Player Car */
    .car {
      background: #e74c3c;
      bottom: 20px;
      left: 165px;
      z-index: 5;
    }

    /* Wheels & Details for Player Car */
    .car::before, .car::after, .enemy::before, .enemy::after {
      content: '';
      position: absolute;
      background: #111;
      width: 8px;
      height: 18px;
      border-radius: 3px;
    }
    .car::before { top: 12px; left: -6px; box-shadow: 62px 0 #111; }
    .car::after { bottom: 12px; left: -6px; box-shadow: 62px 0 #111; }

    /* Enemy Car */
    .enemy {
      background: #f1c40f;
      top: -100px;
    }

    /* Game Over / Start Screen */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    .overlay h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #e74c3c;
    }

    .overlay p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #ccc;
    }

    .start-btn {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #2ecc71;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    .start-btn:hover {
      background: #27ae60;
      transform: scale(1.05);
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameContainer">
    <div class="score-board">Score: <span id="score">0</span></div>

    <!-- Start / Game Over Screen -->
    <div class="overlay" id="overlay">
      <h1 id="title">2D Car Racing</h1>
      <p id="desc">استعمل الأزرار (← → ↑ ↓) باش تحرك الطوموبيل وتفادى الكسايد!</p>
      <button class="start-btn" id="startBtn">ابدأ اللعب</button>
    </div>

    <!-- Player Car -->
    <div class="car" id="playerCar"></div>
  </div>

  <script>
    const gameContainer = document.getElementById('gameContainer');
    const playerCar = document.getElementById('playerCar');
    const scoreElement = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');

    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
    let player = { speed: 5, score: 0, isPlaying: false };

    // Listeners for keyboard controls
    document.addEventListener('keydown', (e) => keys[e.key] = true);
    document.addEventListener('keyup', (e) => keys[e.key] = false);

    startBtn.addEventListener('click', startGame);

    function startGame() {
      overlay.classList.add('hide');
      
      // Clean previous lines and enemies
      document.querySelectorAll('.line, .enemy').forEach(el => el.remove());

      player.isPlaying = true;
      player.score = 0;
      scoreElement.innerText = player.score;

      // Reset Player Position
      playerCar.style.left = "165px";
      playerCar.style.top = "480px";

      // Create Road Lines
      for (let i = 0; i < 5; i++) {
        let line = document.createElement('div');
        line.classList.add('line');
        line.y = i * 150;
        line.style.top = line.y + "px";
        gameContainer.appendChild(line);
      }

      // Create Enemies
      for (let i = 0; i < 3; i++) {
        let enemy = document.createElement('div');
        enemy.classList.add('enemy');
        enemy.y = ((i + 1) * -200);
