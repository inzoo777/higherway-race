<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Car Racing Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 320px;
            height: 500px;
            background: #555;
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background: #333;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #start-screen h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        .btn {
            padding: 12px 24px;
            font-size: 18px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        /* Mobile Controls */
        #controls {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-top: 15px;
        }
        .touch-btn {
            width: 48%;
            height: 60px;
            background: #444;
            color: #fff;
            border: 2px solid #666;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: #666;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="500"></canvas>
        <div id="ui-overlay">Score: <span id="score">0</span></div>
        <div id="start-screen">
            <h1 id="screen-title">2D Car Racing</h1>
            <p id="final-score" style="display:none; margin-bottom:10px;"></p>
            <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="controls">
        <div class="touch-btn" id="left-btn">◀ LEFT</div>
        <div class="touch-btn" id="right-btn">RIGHT ▶</div>
    </div>
